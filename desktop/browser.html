<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; frame-src http: https:;">
<title>Nyx Browser</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #030712;
    overflow: hidden;
    user-select: none;
  }

  /* ─── Top chrome / toolbar ─── */
  #chrome {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px;
    background: #0f172a;
    border-bottom: 1px solid #1e293b;
    z-index: 2147483647;
    height: 44px;
    -webkit-app-region: drag;
  }

  .nav-btn {
    -webkit-app-region: no-drag;
    background: transparent; border: none; color: #64748b;
    cursor: pointer; padding: 5px 7px; border-radius: 6px;
    font-size: 15px; line-height: 1; transition: background .12s, color .12s, transform .08s;
    min-width: 30px; display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { background: #1e293b; color: #e2e8f0; }
  .nav-btn:active { background: #334155; transform: scale(.9); }
  .nav-btn:disabled { opacity: .25; cursor: default; pointer-events: none; }
  .nav-btn.flash { background: #7c3aed; color: #fff; }

  /* ─── URL bar ─── */
  #url-bar {
    -webkit-app-region: no-drag;
    flex: 1; display: flex; align-items: center;
    background: #1e293b; border: 1.5px solid #334155;
    border-radius: 8px; padding: 3px 10px; margin: 0 4px;
    transition: border-color .15s, box-shadow .15s;
  }
  #url-bar:focus-within { border-color: #7c3aed; box-shadow: 0 0 0 2px rgba(124,58,237,.18); }

  #lock-icon { font-size: 12px; margin-right: 6px; flex-shrink: 0; }
  #lock-icon.secure { color: #34d399; }
  #lock-icon.insecure { color: #f59e0b; }
  #lock-icon.error { color: #f87171; }

  #url-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #e2e8f0; font-size: 13px; font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
    padding: 3px 0;
  }
  #url-input::placeholder { color: #475569; }
  #url-input::selection { background: #7c3aed44; }

  #capture-badge {
    -webkit-app-region: no-drag;
    font-size: 10px; font-weight: 700; color: #a855f7;
    background: rgba(168,85,247,.12); border: 1px solid rgba(168,85,247,.25);
    padding: 2px 7px; border-radius: 4px; letter-spacing: .3px;
    margin-left: 4px; flex-shrink: 0;
  }

  /* ─── Loading bar ─── */
  #loading-bar {
    position: fixed; top: 44px; left: 0; right: 0; height: 2px;
    z-index: 2147483647; background: transparent; overflow: hidden;
  }
  #loading-fill {
    height: 100%; width: 0; background: linear-gradient(90deg, #7c3aed, #a855f7, #6366f1);
    border-radius: 2px; transition: width .3s ease;
  }
  #loading-bar.active #loading-fill {
    animation: load-progress 2s ease-in-out infinite;
  }
  @keyframes load-progress {
    0%   { width: 0%; opacity: 1; }
    60%  { width: 80%; opacity: 1; }
    100% { width: 100%; opacity: 0; }
  }

  /* ─── Webview ─── */
  #page {
    position: fixed; top: 46px; left: 0; right: 0; bottom: 22px;
    border: none; width: 100%; height: calc(100vh - 68px);
  }

  /* ─── Error overlay (covers the black screen) ─── */
  #error-overlay {
    position: fixed; top: 46px; left: 0; right: 0; bottom: 22px;
    background: #030712; z-index: 1000;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 40px; text-align: center;
  }
  #error-overlay.visible { display: flex; }
  .error-icon { font-size: 52px; filter: grayscale(.3); }
  .error-title { font-size: 18px; font-weight: 600; color: #f1f5f9; }
  .error-desc { font-size: 13px; color: #64748b; max-width: 480px; line-height: 1.6; }
  .error-code { font-size: 12px; font-family: monospace; color: #475569;
    background: #0f172a; padding: 4px 12px; border-radius: 6px; border: 1px solid #1e293b; }
  .error-tips { margin-top: 8px; }
  .error-tips p { font-size: 12px; color: #475569; margin: 3px 0; }
  .error-tips p strong { color: #94a3b8; }
  .btn-retry {
    margin-top: 8px; padding: 8px 24px; background: #7c3aed; border: none;
    color: #fff; border-radius: 8px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background .15s, transform .08s;
  }
  .btn-retry:hover { background: #6d28d9; }
  .btn-retry:active { transform: scale(.96); }

  /* ─── Status bar ─── */
  #status-bar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 22px;
    background: #0f172a; border-top: 1px solid #1e293b;
    z-index: 2147483647; display: flex; align-items: center;
    padding: 0 12px; gap: 12px; font-size: 10px; font-family: monospace; color: #475569;
  }
  #status-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #proxy-indicator {
    color: #a855f7; font-weight: 700; flex-shrink: 0;
    display: flex; align-items: center; gap: 4px;
  }
  #proxy-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #a855f7;
    box-shadow: 0 0 6px #a855f7;
  }
</style>
</head>
<body>

<!-- ── Toolbar ── -->
<div id="chrome">
  <button id="back-btn" class="nav-btn" title="Back (Alt+←)">&#9664;</button>
  <button id="forward-btn" class="nav-btn" title="Forward (Alt+→)">&#9654;</button>
  <button id="refresh-btn" class="nav-btn" title="Refresh (F5)" style="font-size:18px;">&#8635;</button>

  <div id="url-bar">
    <span id="lock-icon" title="">🔒</span>
    <input id="url-input" type="text" placeholder="Search or enter a URL..." spellcheck="false" autofocus>
  </div>

  <span id="capture-badge" title="Traffic is being proxied through Nyx on 127.0.0.1:8080">⬤ PROXIED</span>
</div>

<!-- ── Progress bar ── -->
<div id="loading-bar"><div id="loading-fill"></div></div>

<!-- ── Webview ── -->
<!-- No ``allowpopups``: popups from a test target inherited this partition
     and rendered outside every navigation guard. The main process enforces
     the same rule with setWindowOpenHandler. -->
<webview id="page" src="about:blank" partition="persist:nyx-browser"
         webpreferences="contextIsolation=yes, nodeIntegration=no, sandbox=yes"></webview>

<!-- ── Error overlay (shown instead of blank/black screen) ── -->
<div id="error-overlay">
  <div class="error-icon">🌐</div>
  <div class="error-title" id="err-title">Connection Failed</div>
  <div class="error-desc" id="err-desc">Nyx could not connect to this site.</div>
  <div class="error-code" id="err-code"></div>
  <div class="error-tips" id="err-tips"></div>
  <button class="btn-retry" id="btn-retry">Try Again</button>
</div>

<!-- ── Status bar ── -->
<div id="status-bar">
  <span id="status-text">Ready — type a URL and press Enter</span>
  <span id="proxy-indicator"><span id="proxy-dot"></span> 127.0.0.1:8080</span>
</div>

<script src="browser-renderer.js"></script>
</body>
</html>
