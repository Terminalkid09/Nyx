name: Build & Release Nyx Desktop

on:
  push:
    tags:
      - 'v*'
  # Manual trigger (also used to re-run a release when a tag push gets
  # swallowed by GitHub's event delivery during rapid delete/re-push churn):
  # run it against an existing v* tag ref and it rebuilds + re-uploads with
  # overwrite_files, replacing the assets in place.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-backend:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnss3 libnspr4 libdbus-1-3 \
            libatk-bridge2.0-0 libcups2 libdrm2 libatk1.0-0 libxcomposite1 \
            libxdamage1 libxrandr2 libgbm1 libxkbcommon0 libpango-1.0-0 \
            libcairo2 libgdk-pixbuf2.0-0

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build backend binary (PyInstaller)
        working-directory: .
        run: pyinstaller --noconfirm desktop/nyx-backend.spec

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go Collaborator
        working-directory: collaborator
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            go build -ldflags="-s -w" -o ../dist/nyx-collaborator.exe .
          else
            go build -ldflags="-s -w" -o ../dist/nyx-collaborator .
          fi
        shell: bash

      - name: Upload backend & collaborator binaries
        uses: actions/upload-artifact@v4
        with:
          name: nyx-binaries-${{ runner.os }}
          path: dist/nyx-*
          retention-days: 1

  build-desktop:
    needs: build-backend
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win
            asset_pattern: |
              desktop/dist/*.exe
              desktop/dist/*.exe.blockmap
              desktop/dist/latest.yml
          - os: macos-latest
            target: --mac
            asset_pattern: |
              desktop/dist/*.dmg
              desktop/dist/*.dmg.blockmap
              desktop/dist/latest-mac.yml
          - os: ubuntu-latest
            target: --linux
            asset_pattern: |
              desktop/dist/*.AppImage
              desktop/dist/*.deb
              desktop/dist/latest-linux.yml
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: nyx-binaries-${{ runner.os }}
          path: dist

      - name: Make backend binary executable (macOS/Linux)
        if: runner.os != 'Windows'
        run: chmod +x dist/nyx-backend* dist/nyx-collaborator*

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer
        working-directory: desktop
        # Publish explicitly DISABLED: electron-builder must only BUILD here.
        # Its own GitHub publishing + the softprops upload step would each
        # attach the installers, duplicating assets under different names
        # (and latest.yml's sha512 then pointed at a stale asset).
        #
        # No env block here ON PURPOSE:
        # - no CSC_LINK/APPLE_*: unset secrets arrive as EMPTY STRINGS and
        #   electron-builder treats CSC_LINK as a certificate *path*,
        #   resolving it against the project dir -> "desktop not a file"
        #   on macOS. With no signing env at all, eb skips signing cleanly
        #   (unsigned mac builds; Gatekeeper warns on first launch).
        # - no GH_TOKEN: with a token AND a release tag on the current
        #   commit, electron-builder v26 publishes on its own even with
        #   --publish never (observed: a second "Nyx 1.0.0.exe" asset
        #   appeared next to the workflow-uploaded one). Without a token
        #   eb skips publishing; the upload step below is the only
        #   publisher.
        run: npm run dist -- ${{ matrix.target }} --publish never

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_pattern }}
          # Re-running the release (re-tag) must REPLACE assets, not pile up
          # duplicates -- GitHub renames on same-name conflict otherwise.
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
