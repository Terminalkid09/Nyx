name: Build & Release Nyx Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-backend:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnss3 libnspr4 libdbus-1-3 \
            libatk-bridge2.0-0 libcups2 libdrm2 libatk1.0-0 libxcomposite1 \
            libxdamage1 libxrandr2 libgbm1 libxkbcommon0 libpango-1.0-0 \
            libcairo2 libgdk-pixbuf2.0-0

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build backend binary (PyInstaller)
        working-directory: .
        run: pyinstaller --noconfirm desktop/nyx-backend.spec

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go Collaborator
        working-directory: collaborator
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            go build -ldflags="-s -w" -o ../dist/nyx-collaborator.exe .
          else
            go build -ldflags="-s -w" -o ../dist/nyx-collaborator .
          fi
        shell: bash

      - name: Upload backend & collaborator binaries
        uses: actions/upload-artifact@v4
        with:
          name: nyx-binaries-${{ runner.os }}
          path: dist/nyx-*
          retention-days: 1

  build-desktop:
    needs: build-backend
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win
            asset_pattern: |
              desktop/dist/*.exe
              desktop/dist/*.exe.blockmap
              desktop/dist/latest.yml
          - os: macos-latest
            target: --mac
            asset_pattern: |
              desktop/dist/*.dmg
              desktop/dist/*.dmg.blockmap
              desktop/dist/latest-mac.yml
          - os: ubuntu-latest
            target: --linux
            asset_pattern: |
              desktop/dist/*.AppImage
              desktop/dist/*.deb
              desktop/dist/latest-linux.yml
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: nyx-binaries-${{ runner.os }}
          path: dist

      - name: Make backend binary executable (macOS/Linux)
        if: runner.os != 'Windows'
        run: chmod +x dist/nyx-backend* dist/nyx-collaborator*

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer
        working-directory: desktop
        run: npm run dist ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: do NOT pass CSC_LINK/APPLE_* secrets here. When unset they
          # arrive as EMPTY STRINGS, and electron-builder then treats CSC_LINK
          # as a certificate *path*, resolving it against the project dir →
          # "⨯ .../desktop not a file" on macOS. With no signing env at all,
          # eb cleanly skips signing (macOS builds are unsigned — Gatekeeper
          # shows the standard warning on first launch).

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_pattern }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
