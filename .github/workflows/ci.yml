name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run unit tests
        working-directory: .
        run: |
          python -m pytest tests/test_auth_keeper.py \
                           tests/test_idor_check.py \
                           tests/test_content_discovery.py \
                           tests/test_auto_exploit.py \
                           tests/test_recommender.py \
                           -q --timeout=60 -x --asyncio-mode=auto \
                           --tb=short
        env:
          PYTHONPATH: backend

  backend-tests:
    name: Backend Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run full backend test suite
        working-directory: .
        run: python -m pytest backend/tests -q --asyncio-mode=auto --tb=short
        env:
          PYTHONPATH: backend

  backend-syntax:
    name: Backend Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile all backend modules
        run: python -m compileall backend/ -q

      - name: Check new feature modules explicitly
        run: |
          python -m compileall \
            backend/modules/scanner/auth_keeper.py \
            backend/modules/scanner/active/checks/idor.py \
            backend/modules/content_discovery/service.py \
            backend/modules/automations/param_chain.py \
            backend/modules/compliance/reporter.py \
            backend/core/metrics.py \
            backend/core/audit.py \
            backend/core/storage/encrypted.py \
            backend/api/routes/compliance.py \
            -q

  frontend:
    name: Frontend Build, Type Check, Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint (errors fail the build; warnings are tracked debt)
        working-directory: frontend
        run: npx eslint src --ext .ts,.tsx --max-warnings 10000

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  desktop-lint:
    name: Desktop Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Verify electron-builder is available
        working-directory: desktop
        run: npx electron-builder --help > /dev/null 2>&1 && echo "electron-builder OK"