[pytest]
; Import mode/async: tests use bare ``async def`` coroutines without
; @pytest.mark.asyncio. CI used to pass --asyncio-mode=auto on the command
; line, so a fresh clone running plain ``pytest`` failed with one async test.
; Keeping the setting here makes the documented command the correct one.
asyncio_mode = auto
testpaths = tests
; A hung network probe must fail the suite instead of blocking CI forever.
timeout = 60
