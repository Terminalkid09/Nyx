services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nyx}
      POSTGRES_DB: ${POSTGRES_DB:-nyx}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyx}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nyx}:${POSTGRES_PASSWORD:-nyx}@postgres:5432/${POSTGRES_DB:-nyx}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEBUG: ${DEBUG:-false}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      PROXY_HOST: 0.0.0.0
      PROXY_PORT: 8080
      MAX_BODY_SIZE_BYTES: 10485760
    depends_on:
      postgres:
        condition: service_healthy

  collaborator:
    build:
      context: ./collaborator
    ports:
      - "127.0.0.1:9999:9999"
      - "127.0.0.1:9090:9090"
    environment:
      COLLAB_DOMAIN: ${COLLAB_DOMAIN:-oast.nyx.local}
      COLLAB_SECRET: ${COLLAB_SECRET:-secret}
      COLLAB_HTTP_PORT: "9999"
      COLLAB_API_PORT: "9090"
      COLLAB_TTL_HOURS: "24"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
